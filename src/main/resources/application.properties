server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
bank.url=http://localhost:8080/payments
# Strict JSON: 4.5 must not become 4 for expiryMonth or expiryYear, and "100" or a numeric card number must not be coerced.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# Observability: only health and metrics are exposed, with liveness and readiness probes.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [requestId=%X{requestId}]

